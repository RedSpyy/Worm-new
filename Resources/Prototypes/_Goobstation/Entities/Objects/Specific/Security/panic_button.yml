- type: entity
  id: PanicButton
  name: distress signaller
  description: A small device with a small red button on the top. Press it to send a distress signal over the security channel.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/panicbutton.rsi
    state: icon
  - type: TriggerOnUse
  - type: RattleOnTrigger
    radioChannel: Security
    messages: {Alive: rattle-on-trigger-alive-panic-button-message}
  - type: MobState
    currentState: Alive
  - type: UseDelay
    delay: 10
